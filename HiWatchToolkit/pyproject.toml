[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hiwatch-toolkit"
version = "0.1.0"
description = "Desktop application for HiWatch Pro smartwatch watch face management"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "HiWatch Toolkit Contributors"}
]
dependencies = [
    "PySide6>=6.6.0",
    "bleak>=0.21.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
]

[tool.setuptools.package-dir]
hiwatch_toolkit = "src/hiwatch_toolkit"

[tool.setuptools.packages.find]
where = ["src"]
include = ["hiwatch_toolkit*"]

[tool.setuptools.package-data]
hiwatch_toolkit = ["py.typed"]
